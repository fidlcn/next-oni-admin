# Next Oni Admin — 容器内 Nginx 配置（本地 Docker 部署）
# 80 端口作为统一入口：
#   /v1/* /uploads/* /api-docs → 反代 NestJS API (127.0.0.1:3000)
#   其余路径 → 管理后台 SPA 静态文件（React Router 前端路由回退到 index.html）
# 主站（Next.js :3001）不经过此 Nginx，直接映射到宿主机。

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /var/log/nginx/access.log;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 50m;
  proxy_http_version 1.1;

  server {
    listen 80 default_server;
    server_name _;

    root /app/apps/web/dist;
    index index.html;

    # API —— 与前端同源，规避 CORS / CSRF / Cookie 跨域问题
    location /v1/ {
      proxy_pass http://127.0.0.1:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件由 NestJS 静态服务
    location /uploads/ {
      proxy_pass http://127.0.0.1:3000;
      proxy_set_header Host $host;
    }

    # 托管页（AI 生成 HTML）—— 与 deploy/nginx.conf 的 /p/ 块保持一致的安全头
    location /p/ {
      alias /app/apps/server/pages/;
      add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src https: data:" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Robots-Tag "noindex" always;
      add_header Cache-Control "public, max-age=300" always;
    }

    # Swagger 文档 —— API 已切生产模式，默认不再暴露；需要时设 NODE_ENV=development 重建
    location /api-docs {
      proxy_pass http://127.0.0.1:3000;
      proxy_set_header Host $host;
    }

    # 管理后台 SPA —— 前端路由回退
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
