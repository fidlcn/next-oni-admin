# Next Oni Admin — 容器内进程托管
# supervisord 同时管理 Nginx、NestJS API、Next.js 主站三个进程

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

# NestJS API（:3000）
# 以生产模式运行：synchronize 关闭（走迁移）、SQL 日志关闭、Swagger 关闭；
# COOKIE_SECURITY 由 compose 显式控制（本地 http 部署需 false，见 docker-compose.yml）
[program:api]
command=node dist/main.js
directory=/app/apps/server
environment=NODE_ENV="production"
autorestart=true
startretries=20
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Next.js 主站（:3001）
[program:site]
command=node node_modules/next/dist/bin/next start --port 3001
directory=/app/apps/site
environment=NODE_ENV="production",PORT="3001",NEXT_TELEMETRY_DISABLED="1"
autorestart=true
startretries=20
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Nginx（:80，管理后台 + API 反代）
[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
